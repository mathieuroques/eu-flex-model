run:
  name: teaser
  keep_files: true
scenario:
  ty:
  - 2030
  cy:
  - 2013
eva:
  sensitivity: true
  max_it: 1
  build_network:
    sensitivity_path: data/teaser/ty_{ty}_cy_{cy}
    forecast_timeseries_source: csv
    forecast_p_max_pu_path: data/teaser/ty_2030_cy_2013/generators-p_max_pu-forecast.csv
    forecast_p_set_path: data/teaser/ty_2030_cy_2013/loads-p_set-forecast.csv
  short_term_requirements:
    method: simulation
  dummy_storage_optimization:
    enable: false
  storage_planning:
    po_resolution: 4h
  ramping_shortfall:
    enable: false
solving:
  solver_options:
    highs-default:
      ipm_optimality_tolerance: 1e-6
    highs-milp:
      threads: 1
      mip_rel_gap: 0.0001
      primal_feasibility_tolerance: 1.0e-06
      dual_feasibility_tolerance: 1.0e-06
      random_seed: 123
      log_to_console: false
  solver:
    name: highs
    options: highs-milp
  options:
    linearized_unit_commitment: false
