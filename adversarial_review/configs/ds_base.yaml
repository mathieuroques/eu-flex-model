# Contributors to EU-Wide Flexibility Needs Assessment Model of the Future European Energy System
#
# The dummy storage optimisation of the ACER paper "Preparing for the European
# flexibility needs assessment" (2026), on the same model as
# config/teaser.yaml: a single EVA iteration without maintenance planning,
# followed by the dummy storage optimisation over a grid of storage durations
# and curtailment targets. Here cross-border link flows are fixed to the market
# result; config/teaser-ds-cross-border.yaml re-optimises them with the storage.

run:
  name: ds-reduced
  keep_files: true  # keep the intermediate networks

scenario:
  ty: [2030]
  cy: [2013]

eva:
  sensitivity: true
  max_it: 1
  build_network:
    sensitivity_path: data/teaser/ty_{ty}_cy_{cy}
    forecast_timeseries_source: csv
    forecast_p_max_pu_path: data/teaser/ty_2030_cy_2013/generators-p_max_pu-forecast.csv
    forecast_p_set_path: data/teaser/ty_2030_cy_2013/loads-p_set-forecast.csv
  short_term_requirements:
    method: simulation
  dummy_storage_optimization:
    enable: true
    energy_power_ratios: [4, 50, 200]
    curtailment_targets: [0.05, 0.02]
    shared_across_countries: false
    minimize_system_costs: false
    network_needs: false
    enable_load_spillage: true
    export_models: false
    conventional_floor_carriers: [Nuclear]
  storage_planning:
    po_resolution: 4h
  ramping_shortfall:
    enable: false

solving:
  maintenance_planning:
    enable: false
  solver_options:
    highs-default:
      ipm_optimality_tolerance: 1e-6
